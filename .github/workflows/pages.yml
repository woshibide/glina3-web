name: Design preview

on:
  push:
    branches: [develop]

concurrency:
  group: glina-design-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.GLINA_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, gd, mbstring, xmlwriter
          coverage: none
      - name: Install locked dependencies
        run: |
          composer install --prefer-dist --no-interaction
          npm ci
      - name: Check source and cup tool
        run: |
          composer check
          npm test --workspace glina-cup-tool
      - name: Check static preview in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/glina-browser" --no-audit --no-fund playwright@1.65.1
          "$RUNNER_TEMP/glina-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/glina-browser/node_modules" node scripts/check-pages.cjs
      - uses: actions/configure-pages@v5
        id: pages
      - name: Export preview at the Pages URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: composer build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
